<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC-1 WebGPU check</title>
<style>
  body { font: 1rem system-ui, sans-serif; margin: 40px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  canvas { width: 128px; height: 128px; border: 1px solid; }
</style>
<h1>WebGPU check</h1>
<p>This checks compute results, rendered pixels and canvas submission.
Use HTTPS or a localhost server. For hardware testing, check that
<code>chrome://gpu</code> reports Mali/Panfrost.</p>
<pre id="result">Running…</pre>
<script>
async function runWebGPUSmoke() {
  if (!isSecureContext || !navigator.gpu) throw Error('WebGPU unavailable');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw Error('No default adapter');
  const device = await adapter.requestDevice();
  try {
    const errors=[];
    device.addEventListener('uncapturederror', e => errors.push(e.error.message));
    device.pushErrorScope('validation');
    const shader = device.createShaderModule({code: `
      @group(0) @binding(0) var<storage, read_write> output: array<u32>;
      @compute @workgroup_size(64) fn compute(@builtin(global_invocation_id) id: vec3u) {
        output[id.x] = id.x * 3u + 7u;
      }
      @vertex fn vertex(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var p = array<vec2f, 3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3));
        return vec4f(p[i], 0, 1);
      }
      @fragment fn fragment() -> @location(0) vec4f {return vec4f(1,0.5,0.25,1);}
    `});
    const compilation = await shader.getCompilationInfo();
    if (compilation.messages.some(m => m.type === 'error')) throw Error(JSON.stringify(compilation.messages));
    const compute = await device.createComputePipelineAsync({layout:'auto',compute:{module:shader,entryPoint:'compute'}});
    const storage=device.createBuffer({size:256,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});
    const read=device.createBuffer({size:256,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
    const bind=device.createBindGroup({layout:compute.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:storage}}]});
    const texture=device.createTexture({size:[4,4],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
    const pixel=device.createBuffer({size:1024,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
    const render=await device.createRenderPipelineAsync({layout:'auto',vertex:{module:shader,entryPoint:'vertex'},fragment:{module:shader,entryPoint:'fragment',targets:[{format:'rgba8unorm'}]}});
    const encoder=device.createCommandEncoder();
    const c=encoder.beginComputePass();c.setPipeline(compute);c.setBindGroup(0,bind);c.dispatchWorkgroups(1);c.end();
    encoder.copyBufferToBuffer(storage,0,read,0,256);
    const r=encoder.beginRenderPass({colorAttachments:[{view:texture.createView(),loadOp:'clear',clearValue:[0,0,0,0],storeOp:'store'}]});
    r.setPipeline(render);r.draw(3);r.end();
    encoder.copyTextureToBuffer({texture},{buffer:pixel,bytesPerRow:256},[4,4]);
    device.queue.submit([encoder.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    const values=[...new Uint32Array(read.getMappedRange())];
    if (!values.every((v,i) => v===i*3+7)) throw Error('Compute readback mismatch: '+values);
    read.unmap();
    await pixel.mapAsync(GPUMapMode.READ);
    const bytes=new Uint8Array(pixel.getMappedRange());
    for (let y=0;y<4;y++) for(let x=0;x<4;x++) {
      const p=bytes.slice(y*256+x*4,y*256+x*4+4);
      if(!p.every((v,i)=>v===[255,128,64,255][i])) throw Error('Render mismatch '+p);
    }
    const firstPixel=[...bytes.slice(0,4)];pixel.unmap();
    const canvas=document.createElement('canvas');canvas.width=4;canvas.height=4;document.body.append(canvas);
    const context=canvas.getContext('webgpu');
    context.configure({device,format:navigator.gpu.getPreferredCanvasFormat(),alphaMode:'opaque'});
    const display=device.createCommandEncoder();
    const present=display.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:[1,0.5,0.25,1],loadOp:'clear',storeOp:'store'}]});present.end();
    device.queue.submit([display.finish()]);await device.queue.onSubmittedWorkDone();
    const validation=await device.popErrorScope();
    if(validation || errors.length) throw Error(JSON.stringify({validation:validation?.message,errors}));
    const result={compute:true,values:values.length,render:true,pixel:firstPixel,canvas:true,fallback:adapter.info.isFallbackAdapter,coreFeature:adapter.features.has('core-features-and-limits')};
    return result;
  } finally {
    device.destroy();
  }
}
runWebGPUSmoke().then(result => {
  document.getElementById('result').textContent = 'PASS\n' + JSON.stringify(result, null, 2);
}).catch(error => {
  document.getElementById('result').textContent = 'FAIL\n' + error;
});
</script>
</html>
