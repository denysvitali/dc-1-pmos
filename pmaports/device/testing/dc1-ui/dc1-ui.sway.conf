# Start the DC-1 shell with the Sway session.
#
# Ordered after 00-dc1-output.conf (the device package's panel transform,
# touch calibration matrix and background), so the output exists before a
# client maps a surface onto it.
#
# One exec line only: which screen the shell shows, and the GDK/Mesa
# environment it needs, are decided by /usr/bin/dc1-ui-session. Keeping the
# policy out of here means this drop-in does not have to change again.
exec /usr/bin/dc1-ui-session

# The shell IS the device during first boot, so it gets the whole panel: no
# title bar, no border, and fullscreen so it covers the status bar too.
# Photographed on hardware 2026-08-15 without this: the onboarding Wi-Fi
# screen appeared inside a tiled window with a "dc1_shell" title bar, a clock
# bar above it and a swaynag strip on top of that -- three pieces of desktop
# furniture in front of a person who has just been asked to pick a network.
#
# scripts/build-flutter-ui.sh rewrites the generated runner's APPLICATION_ID
# to "it.denv.dc1.shell" (the flutter template default is
# "com.example.dc1_shell"), and that string becomes the Wayland app_id via
# g_set_prgname(). Both are matched: if the rewrite is ever dropped or the
# template changes, the shell still gets the whole panel rather than silently
# coming back up with a title bar in front of a person setting up their
# tablet. Sway criteria are regexes, so the second line is a suffix match.
for_window [app_id="^it\.denv\.dc1\.shell$"] fullscreen enable, border none
for_window [app_id=".*dc1_shell$"] fullscreen enable, border none
