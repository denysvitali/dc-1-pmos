[daemon]
# Autologin the build-time user for first boot. tinydm did this with a FIXED
# uid (AUTOLOGIN_UID=10000); gdm autologs in by NAME, so this names the pmOS
# default user `dc1` (uid 10000) directly.
#
# The DC-1 is touch-only: without autologin it lands on the gdm greeter with
# no physical keyboard, and first-boot onboarding never runs. After onboarding
# renames the user (provision.sh rename_in_group), `dc1` no longer exists and
# gdm falls back to the normal greeter for the renamed account -- which is the
# intended post-provisioning behaviour.
AutomaticLoginEnable=True
AutomaticLogin=dc1
