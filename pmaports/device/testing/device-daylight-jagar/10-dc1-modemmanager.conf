[Unit]
# The DC-1 has no cellular modem. GNOME's generic base still installs and
# enables ModemManager, so keep the unused daemon dormant unless an
# administrator explicitly opts into external-modem support with:
#
#   mkdir -p /var/lib/dc1 && touch /var/lib/dc1/enable-modemmanager
#   systemctl start ModemManager
ConditionPathExists=/var/lib/dc1/enable-modemmanager
