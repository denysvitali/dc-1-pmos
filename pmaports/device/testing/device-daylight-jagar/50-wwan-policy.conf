# Override postmarketos-base-ui-networkmanager's same-named vendor drop-in.
# Its per-device check-connectivity key is not supported by the NetworkManager
# version in this image and produces a warning at every boot. Keep the valid
# route-table policy in case a USB cellular modem is attached later.
[connection-wwan]
match-device=type:gsm
ipv4.route-table=1430
ipv6.route-table=1430
