# DC-1 systemd watchdog ownership. The initramfs petter hands /dev/watchdog to
# systemd at switch_root (magic close -- mtk_wdt is nowayout=0), and systemd
# re-opens it here and pings only while healthy.
#
# RuntimeWatchdogSec: systemd pings the hardware watchdog every half this
# interval. A hung systemd (PID 1) stops pinging and the board resets in this
# many seconds instead of sitting dark forever. LK arms the SoC watchdog at
# ~31s, so this stays comfortably under it.
#
# RebootWatchdogSec: arms the watchdog across a reboot; if the shutdown/reboot
# path hangs, the board still resets. This covers systemd-shutdown's final
# phase only (kill stragglers, unmount, reboot), not the unit-stop phase before
# it. Measured on hardware 2026-08-17, that phase is 0.35s healthy; it was 90s
# only because an interactive busybox shell ignored SIGTERM (fixed in the
# initramfs and in dc1-debug-shell.service). 10min was the old value and it is
# useless as a backstop -- nobody watching a frozen panel waits that long
# before pulling the power, which is exactly what happened. 90s is ~250x the
# healthy phase and still inside the operator's patience.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=90s
