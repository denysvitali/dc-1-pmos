# Alpine's launcher sources /etc/chromium/*.conf in filename order. Keep this
# after chromium.conf so its defaults survive. Mali-G57 has Panfrost GLES 3.1
# but no Mesa Vulkan driver. Dawn's GLES backend provides compatibility mode;
# force that level for sites using requestAdapter() without featureLevel.
CHROMIUM_FLAGS="${CHROMIUM_FLAGS:-} --use-gl=angle --use-angle=gles --use-webgpu-adapter=opengles --force-webgpu-compat"
