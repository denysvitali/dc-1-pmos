# The DC-1 has no logo key. Upstream's postmarketos-ui-sway config includes
# this file unconditionally (line 14), but it only ships in the optional
# postmarketos-ui-sway-logo-key-alt subpackage -- which --no-recommends drops,
# so the include otherwise errors on every boot. Ship the default here: $logo
# is the Super key (Mod4), matching stock sway. Nothing references $logo on
# this device, so this is purely to satisfy the include cleanly.
set $logo Mod4
