# HiFi use case for the Daylight DC-1 (jagar): MT6789 AFE + MT6366 codec
# (mt6358 driver) + RT9101 external speaker amp.
#
# Speaker path (verified on hardware 2026-08-17 and 2026-08-20; mirrors
# /usr/libexec/dc1-audio):
#   DL1 FE (ALSA device 0, "Playback_1")
#     -> ADDA_DL_CHx via 'ADDA_DL_CHx DL1_CHx'
#     -> codec DAC -> HPL/HPR buffers via 'HPL Mux'/'HPR Mux' 'LoudSPK
#        Playback'
#     -> Ext_Speaker_Amp widget (VIBR rail + GPIO158/159 pinctrl)
#     -> RT9101 -> speakers
# The Verb sequence intentionally matches dc1-audio's calibrated levels
# ('Headphone Volume' 18,18 / 'Lineout Volume' 12,12 / ADDA_DL_GAIN max)
# so UCM adoption does not change the verified output levels.
#
# Capture path (verified on hardware 2026-08-22): the internal mics are
# two-wire digital DMICs on AIN0/AIN2; UL1 (ALSA device 9, "Capture_1")
# is the front end fed by ADDA_UL_CH1/CH2. Capture works with the codec
# left in DMIC mode; the analog PGA/ADC controls are irrelevant for DMIC
# and deliberately not touched here. MTKAIF_DMIC stays Off: on this
# board the codec delivers PCM over MTKAIF, and forcing raw-DMIC
# interpretation in the AFE breaks capture (measured).
#
# There is no headset jack and no analog microphone on this board; do
# not model ACC/DCC/PGA input paths or JackControls here.

SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='HPL Mux' LoudSPK Playback"
		cset "name='HPR Mux' LoudSPK Playback"
		cset "name='Ext_Speaker_Amp Switch' 1"
		cset "name='Headphone Volume' 18,18"
		cset "name='Lineout Volume' 12,12"
		cset "name='ADDA_DL_GAIN' 65535"
	]

	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' 0"
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	EnableSequence [
		cset "name='Ext_Speaker_Amp Switch' 1"
	]

	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='Mic Type Mux' DMIC"
		cset "name='UL1_CH1 ADDA_UL_CH1' 1"
		cset "name='UL1_CH2 ADDA_UL_CH2' 1"
	]

	Value {
		CapturePriority 100
		CaptureChannels 2
		CapturePCM "hw:${CardId},9"
	}
}
