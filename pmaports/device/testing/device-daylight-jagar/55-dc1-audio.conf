# Re-enable audio hardware enumeration for the DC-1.
# pulseaudio-wireplumber ships 51-pulseaudio.conf which disables
# hardware.audio/hardware.bluetooth in the main profile; this fragment,
# applied later in lexical order, restores audio monitoring so the
# mt6789-mt6366 card is enumerated and its UCM profile adopted.
wireplumber.profiles = {
  main = {
    hardware.audio = required
  }
}

# The DC-1 has no cellular modem. Alpine's generic Bluetooth fragment enables
# the ModemManager-backed HFP/HSP integration, which otherwise performs a
# pointless D-Bus probe and warns on every login.
monitor.bluez.properties = {
  bluez5.hfphsp-backend-native-modem = "none"
}
