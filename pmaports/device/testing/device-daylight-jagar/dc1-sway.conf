# DC-1 display output + touch, dropped into /etc/sway/config.d/.
#
# Explicit white background: the default wallpaper package is a --no-recommends
# drop, so without this the panel composits to a black frame that reads as a
# dead display. White reflects the rt4539 frontlight maximally and is a clear
# first-light proof.
output DSI-1 bg #ffffff solid_color

# Touch is physically rotated with the output transform: without this matrix
# both uncalibrated axes land on the opposite side of the visible desktop.
# Hardware corner testing confirmed.
input "type:touch" {
    map_to_output DSI-1
    calibration_matrix -1 0 1 0 -1 1
}

# Pen orientation is not hardware-verified; no calibration matrix on purpose.
input "type:tablet_tool" {
    map_to_output DSI-1
}

font pango:DejaVu Sans 18
