# The DC-1 cannot suspend: s2idle aborts with user-space tasks refusing to
# freeze (~20 s per attempt) and comes back with the panel dark. Make logind
# ignore the power/suspend keys outright, so its default HandlePowerKey action
# (poweroff) can never fire and no key press reaches the sleep path.
#
# Note this does NOT govern the power key under GNOME: gnome-shell-mobile grabs
# it as a mutter keybinding and handles it itself, which is what the gschema
# override next to this file is for. This still covers the greeter, sway, and
# any session that leaves the key to logind.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
