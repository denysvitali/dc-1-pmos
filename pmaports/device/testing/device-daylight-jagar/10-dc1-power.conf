# The DC-1 cannot suspend or re-light a blanked panel, so make logind ignore
# the power/suspend keys outright. Belt-and-suspenders behind the GNOME
# gschema override: this applies even when gnome-settings-daemon is not the
# handler (e.g. at the greeter), and stops logind's default HandlePowerKey
# action (poweroff) from ever firing.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
