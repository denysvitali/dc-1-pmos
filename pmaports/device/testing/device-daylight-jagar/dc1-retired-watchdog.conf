# Compatibility with older boot images only: disable their network watchdog
# and acknowledge their inherited reachability deadman after switch_root.
d /etc/dc1 0755 root root -
f /etc/dc1/boot-watchdog.disabled 0644 root root -
d /var/lib/dc1 0755 root root -
f /var/lib/dc1/boot-ok 0644 root root -
