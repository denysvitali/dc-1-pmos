# CI for dc-1-pmos. Public GitHub-hosted runners only.
#
# verify (ubuntu-24.04, x86, fast): offline packaging/installer/mkboot checks
#   on every push and pull request.
# build (ubuntu-24.04-arm, native aarch64, no qemu): full pinned-source
#   rootfs + kernel build, installer/system boot images, release assembly.
#   Publishes the rolling `latest` prerelease only on pushes to the default
#   branch; PR runs upload a workflow artifact instead.
#
# Every commit builds — no path filters, by design: pmbootstrap skips
# unchanged pkgver-pkgrel, so a "docs-only" filter would be the second layer
# of skipping that hides a broken build recipe.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Versioned release tag (must match pmos-v*). Leave empty to update
          the rolling `latest` prerelease instead.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Fail a bad workflow_dispatch immediately, not after a multi-hour build.
      - name: Validate requested release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in
            pmos-v*) echo "requested release tag: $TAG" ;;
            *) echo "release_tag must match pmos-v*, got: $TAG" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # mkfs.ext4 / e2fsck / dumpe2fs / debugfs live in /usr/sbin, which is
      # not on the default non-root PATH; the offline ext4 test needs them
      # without sudo.
      # timeout-minutes + a bounded retry: on 2026-08-19 this step -- which
      # takes ~1 minute healthy -- hung three separate runs until the job's
      # 30-minute ceiling (GitHub-side apt/mirror weather; runs in between
      # passed unchanged). Better to fail one apt attempt in 5 minutes and
      # retry than to burn the whole job budget in one silent hang.
      - name: Install verification dependencies
        timeout-minutes: 12
        run: |
          # Both tools ship preinstalled on ubuntu-24.04 runners; apt is only
          # a guard against image changes. Today's mirror weather has now
          # failed this step two ways (silent 30-min hang, then bounded
          # double failure), so: skip apt entirely when the binaries already
          # exist, and only hard-fail when they are genuinely missing AND
          # apt cannot deliver them.
          if command -v mkfs.ext4 >/dev/null && command -v zstd >/dev/null \
             || [ -x /usr/sbin/mkfs.ext4 ] && command -v zstd >/dev/null; then
            echo "e2fsprogs + zstd already present; skipping apt"
          else
            for attempt in 1 2; do
              timeout 300 sudo apt-get update && \
              timeout 300 sudo apt-get install -y --no-install-recommends \
                e2fsprogs zstd && break
              echo "apt attempt $attempt failed or hung; retrying" >&2
              [ "$attempt" = 2 ] && exit 1
              sleep 10
            done
          fi
          echo /usr/sbin >> "$GITHUB_PATH"
          echo /sbin >> "$GITHUB_PATH"

      - name: Packaging verification (scripts/verify.sh)
        run: sh scripts/verify.sh

      - name: Installer offline tests
        run: sh installer/tests/run-tests.sh

      # Same compiler contract as installer/build.sh (-static -Os -Wall
      # -Wextra), so an installer C breakage fails here in seconds instead of
      # after the aarch64 rootfs build. init.c talks DRM raw ioctls against
      # the vendored UAPI headers under installer/src/uapi, so pin to them and
      # define __user empty exactly as build.sh does.
      - name: Installer C smoke build
        run: |
          set -eu
          for src in installer/src/init.c installer/src/system/init.c; do
            out=$(mktemp)
            gcc -static -Os -Wall -Wextra -D__user= -I installer/src/uapi -o "$out" "$src"
            rm -f "$out"
            echo "compiled $src"
          done
          # The device-package C tools share dc1-misc.c (the PARTNAME=misc
          # resolver), so each links against it here exactly as the APKBUILD
          # build() does.
          dev=pmaports/device/testing/device-daylight-jagar
          for tool in dc1-reboot-fastboot dc1-slotctl dc1-pwrkey; do
            out=$(mktemp)
            gcc -Wall -Wextra -Os -o "$out" "$dev/$tool.c" "$dev/dc1-misc.c"
            rm -f "$out"
            echo "compiled $dev/$tool.c + $dev/dc1-misc.c"
          done

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # mkboot has no dependencies (no go.sum); key its cache on go.mod.
          # installer/gotools now vendors golang.org/x/image (the
          # anti-aliased font), so key its cache on go.sum.
          cache-dependency-path: |
            boot/mkboot/go.mod
            installer/gotools/go.sum

      - name: mkboot build, vet, test
        working-directory: boot/mkboot
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # The installer daemon owns the byte-critical write path, so its tests
      # (exact splitting from a dribbling reader, superblock held back until
      # the transfer verifies, read-back catching a device that drops writes)
      # are the regression net for the corruption that shipped.
      - name: dc1tools build, vet, test
        working-directory: installer/gotools
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...
          go test ./...
          # It ships into an aarch64 initramfs; prove it cross-compiles here
          # rather than an hour into the device build.
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o /tmp/dc1tools .
          ls -l /tmp/dc1tools

  build:
    runs-on: ubuntu-24.04-arm
    needs: verify
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup
          df -h /

      # Persistence across ephemeral runners. Cached:
      #   cache_ccache*   — compiler cache (ccache_size = 2G in pmb.cfg)
      #   cache_distfiles — kernel source tarballs
      #   cache_apk_aarch64 — upstream Alpine/pmaports binary packages
      #   packages        — OUR built apks (see below)
      # Never cached: chroots.
      #
      # An earlier revision deliberately did NOT cache our built packages, so
      # that export-artifacts.sh's exact pkgver-pkgrel requirement would force
      # a fresh build. That property survives caching: a version bump is
      # absent from the cached repo and builds fresh; only an UNCHANGED
      # pkgver-pkgrel is reused — which is the documented contract ("bump
      # pkgrel when you change a build recipe") and, since dc1-boot-sync,
      # a correctness requirement, not a shortcut (see the next comment).
      #
      # cache_apk_aarch64 is safe to cache because apk always fetches a fresh
      # APKINDEX from the mirror and verifies every cached file against it;
      # any stale or mismatched package is silently re-downloaded. Caching it
      # avoids re-downloading ~1.3 GB of gnome-mobile packages every run.
      #
      # The run_id suffix makes every run save an updated cache; restore
      # falls back to the newest entry for the same (then any) source pins.
      #
      # The BUILT-packages repo is cached too, and it is not an optimization:
      # pmbootstrap only skips a rebuild when the same pkgver-pkgrel apk is
      # already in the local repo, and that repo used to start empty every
      # run. So every push relinked the kernel, the GNU build-id note changed
      # (~32 bytes; everything else byte-identical), and the rolling release
      # replaced the kernel apk AND jagar-boot.img with a pair that only
      # matches ITSELF -- a device that installed the apk from run N and the
      # image from run N+1 fails dc1-boot-sync's kernel comparison forever
      # (measured on hardware 2026-08-19: "it did not stick"). With the repo
      # cached, an unchanged pkgver-pkgrel keeps byte-identical artifacts
      # across runs, which is the property the whole sync design assumes.
      # config_abuild (abuild.conf + the signing keypair; the name comes from
      # pmb/build/init.py, whose keygen triggers on config_abuild/abuild.conf
      # -- the first attempt cached a nonexistent config_abuild_keys and tar
      # silently skipped it) rides in the SAME cache entry as packages, on
      # purpose: the packages are only trustable together with the key that
      # signed them (apk index verifies every .apk; a key/package split
      # brought down two builds). Persisting this key is the same model the
      # pmOS binary mirror uses. Threat check: it signs only the CI-LOCAL
      # repo; everything a device trusts is anchored on the dc1-apk key,
      # which lives in repo secrets, never in a cache. The pmb3- prefix
      # retires the pre-key cache generation atomically.
      - name: Restore pmbootstrap ccache, source and package caches
        uses: actions/cache@v4
        with:
          path: |
            work/postmarketos/pmbootstrap-work/cache_ccache*
            work/postmarketos/pmbootstrap-work/cache_distfiles
            work/postmarketos/pmbootstrap-work/cache_apk_aarch64
            work/postmarketos/pmbootstrap-work/packages
            work/postmarketos/pmbootstrap-work/config_abuild
          key: pmb3-${{ hashFiles('scripts/versions.env') }}-${{ github.run_id }}
          restore-keys: |
            pmb3-${{ hashFiles('scripts/versions.env') }}-
            pmb3-

      # The chroot build runs as pmbootstrap's `pmos` user, which is UID 12345
      # (pmb.config.chroot_uid_user), and pmbootstrap chowns the ccache mount to
      # that user. A restored cache that is owned by anything else -- root, or
      # the runner user after the post-job reclaim below -- is not writable by
      # UID 12345, so ccache dies with "Permission denied" and nothing is
      # cached (hence the ~17 min cold kernel builds). Reclaim ownership up
      # front, before the build, to the chroot user's UID.
      - name: Reclaim restored cache ownership (pre-build)
        run: |
          for d in work/postmarketos/pmbootstrap-work/cache_ccache* \
                   work/postmarketos/pmbootstrap-work/cache_distfiles \
                   work/postmarketos/pmbootstrap-work/packages \
                   work/postmarketos/pmbootstrap-work/config_abuild; do
            if [ -e "$d" ]; then
              sudo chown -R 12345:12345 "$d"
            fi
          done

      # The kernel toolchain (clang-20/LLVM, per the APKBUILD) lives inside
      # the build chroot; the runner only needs the host-side tools. pigz is
      # host-side on purpose: make-rootfs-archive.py pipes the rootfs tar
      # through it, which is the difference between one core and all of them
      # on the longest step of the export.
      # No busybox-static here on purpose: Ubuntu's busybox lacks blkid (it
      # failed installer/build.sh's applet check on a live run). The build
      # script fetches Alpine's pinned busybox-static apk instead, which is
      # also what the initramfs scripts were proven against.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs zstd lz4 cpio file kpartx xz-utils binutils openssl pigz
          echo /usr/sbin >> "$GITHUB_PATH"
          echo /sbin >> "$GITHUB_PATH"

      # installer/build.sh cross-compiles the dc1tools Go userland into the
      # initramfs (CGO_ENABLED=0 GOOS=linux GOARCH=arm64), so this job needs a
      # Go toolchain on PATH before the boot-image build, not just the lint
      # job. This runner is already aarch64, so the "cross" build is native;
      # the flags are kept explicit anyway. gotools vendors golang.org/x/image
      # (the anti-aliased font), so key its cache on go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: installer/gotools/go.sum

      - name: Prepare pinned sources
        run: sh scripts/prepare.sh work/postmarketos

      # pmbootstrap escalates through the runner's passwordless sudo for its
      # chroots; export-artifacts.sh is invoked by this script and fills out/.
      - name: Build rootfs and export artifacts
        # On failure, surface the error tail as ::error:: annotations so the
        # failure is diagnosable through the public checks API.
        run: |
          set -o pipefail
          if ! sh scripts/build-rootfs.sh work/postmarketos out 2>&1 \
              | tee build-rootfs.log; then
            # Annotate the log region just above abuild's ">>> ERROR" marker:
            # that is where the failing command's output lands, and it may
            # contain no greppable error keyword at all.
            pmblog=work/postmarketos/pmbootstrap-work/log.txt
            ln=$(sudo grep -n -m1 '>>> ERROR' "$pmblog" 2>/dev/null | cut -d: -f1)
            if [ -n "$ln" ]; then
              sudo sed -n "$((ln > 8 ? ln - 8 : 1)),${ln}p" "$pmblog"
            else
              sudo tail -n 9 "$pmblog" 2>/dev/null
            fi | while IFS= read -r l; do
              printf '::error::pmblog: %s\n' "$l"
            done
            exit 1
          fi

      # Keep the cache owned by the chroot user (UID 12345) for the save. Its
      # files are world-readable, so the runner can tar them, but chowning to
      # the runner user here would poison the next run's restore (UID 12345
      # would then fail to write -- see the pre-build reclaim above). Run even
      # when the build failed so a failure never archives a mis-owned cache.
      - name: Reclaim cache ownership for the post-job save
        if: always()
        run: |
          for d in work/postmarketos/pmbootstrap-work/cache_ccache* \
                   work/postmarketos/pmbootstrap-work/cache_distfiles \
                   work/postmarketos/pmbootstrap-work/packages \
                   work/postmarketos/pmbootstrap-work/config_abuild; do
            if [ -e "$d" ]; then
              sudo chown -R 12345:12345 "$d"
            fi
          done

      # Root is required for mknod. BUSYBOX defaults to the pinned Alpine
      # busybox-static apk that installer/build.sh downloads itself (Ubuntu's
      # busybox-static lacks blkid); build.sh verifies linkage and the
      # required applets natively — no qemu, this runner is aarch64.
      # MODDIR is passed only if the built rootfs actually shipped modules
      # (the gadget stack may be built in).
      # clang/lld/dtc build the dtbswap stub + payload so both boot images
      # boot the MAINLINE device tree (issue #1: the stock tree black-screens
      # installation mode on some units, so installer-boot.img carries it too).
      # Ubuntu's default clang is fine for the 6 KB freestanding stub -- a
      # clang19 build of it was boot-proven on hardware 2026-08-19; the kernel
      # itself keeps its pinned toolchain inside pmbootstrap.
      - name: Install dtbswap stub toolchain
        timeout-minutes: 12
        run: |
          # Same mirror-weather tolerance as the verify job's apt step:
          # skip apt when everything is already on the image.
          if command -v clang >/dev/null && command -v ld.lld >/dev/null \
             && command -v llvm-objcopy >/dev/null && command -v dtc >/dev/null \
             && command -v python3 >/dev/null; then
            echo "stub toolchain already present; skipping apt"
          else
            for attempt in 1 2; do
              timeout 300 sudo apt-get update && \
              timeout 300 sudo apt-get install -y --no-install-recommends \
                clang lld llvm device-tree-compiler python3 && break
              echo "apt attempt $attempt failed or hung; retrying" >&2
              [ "$attempt" = 2 ] && exit 1
              sleep 10
            done
          fi

      - name: Build installer and system boot images
        run: |
          moddir=$(sudo sh -c \
            'ls -d work/postmarketos/pmbootstrap-work/chroot_rootfs_daylight-jagar/lib/modules/* 2>/dev/null' \
            | head -n 1 || true)
          # The full log is teed to a file and uploaded as an artifact on
          # failure: the Actions log API needs authentication, but artifacts
          # on a public repo do not, so a red run stays diagnosable from
          # anywhere.
          set -o pipefail
          if [ -n "$moddir" ]; then
            echo "staging kernel modules from $moddir"
            sudo env KERNEL_IMAGE="$GITHUB_WORKSPACE/out/boot/Image.gz" \
              KERNEL_DTB="$GITHUB_WORKSPACE/out/boot/mt8781-daylight-jagar.dtb" \
              DTBSWAP_LLVM=/usr/bin/ DTBSWAP_LLD=/usr/bin/ld.lld \
              MODDIR="$moddir" sh installer/build.sh 2>&1 | tee boot-images.log
          else
            echo "no kernel modules directory found; building without MODDIR"
            sudo env KERNEL_IMAGE="$GITHUB_WORKSPACE/out/boot/Image.gz" \
              KERNEL_DTB="$GITHUB_WORKSPACE/out/boot/mt8781-daylight-jagar.dtb" \
              DTBSWAP_LLVM=/usr/bin/ DTBSWAP_LLD=/usr/bin/ld.lld \
              sh installer/build.sh 2>&1 | tee boot-images.log
          fi
          # The release must never silently regress to a stock-DT image:
          # prove each kernel slot is a dtbswap payload (stub magic at 56,
          # payload table at 0x40, FDT magic at the dtb offset). Both images
          # carry it -- issue #1 proved installation mode needs the mainline
          # tree on some units.
          python3 - <<'EOF'
          import struct, gzip
          for name in ('installer-boot.img', 'jagar-boot.img'):
              img = open(f'installer/out/{name}','rb').read()
              ks = struct.unpack_from('<I', img, 8)[0]
              blob = gzip.decompress(img[4096:4096+ks])
              assert blob[56:60] == b'ARM\x64', f"{name}: kernel slot is not an arm64 image"
              doff, dlen, koff, klen = struct.unpack_from('<4I', blob, 0x40)
              assert blob[doff:doff+4] == b'\xd0\x0d\xfe\xed', f"{name}: no FDT at dtb offset: not a dtbswap payload"
              assert koff + klen == len(blob), f"{name}: payload table inconsistent"
              print(f"{name} is a dtbswap payload: dtb {dlen}B @ {doff}, kernel {klen}B @ {koff}")
          EOF

      - name: Upload boot-image build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-build-log
          path: boot-images.log
          if-no-files-found: ignore

      # One directory holding exactly what the README promises users, with a
      # single regenerated SHA256SUMS: the exporter's manifest predates the
      # boot images, so it cannot cover them. PROVENANCE is shipped verbatim
      # (hardware_verified=false stays untouched).
      - name: Assemble release directory
        run: |
          mkdir release
          cp out/packages/*.apk release/
          cp out/jagar-rootfs.tar.gz out/jagar-rootfs.ext4.zst release/
          cp installer/out/installer-boot.img installer/out/jagar-boot.img release/
          cp installer/host/dc1-install.sh release/

          # Rescue path for pre-key installs: the repair script plus the
          # public key it installs (hash-verified against this same
          # release's SHA256SUMS at run time).
          cp installer/host/dc1-repair-apk.sh release/
          cp pmaports/device/testing/device-daylight-jagar/dc1-apk.rsa.pub release/
          cp out/PROVENANCE out/SOURCES out/FILES.tsv release/
          grep -qx 'hardware_verified=false' release/PROVENANCE

          # No jagar-vendor-boot.img on purpose. LK builds the kernel's tree
          # from its SIGNED lk_main_dtb + dtbo and never reads vendor_boot's
          # DTB, so a vendor_boot image cannot ship a device tree; the tree
          # reaches the kernel through the dtbswap stub inside jagar-boot.img
          # (asserted above). Writing vendor_boot buys nothing.

          (cd release && sha256sum -- *) | LC_ALL=C sort -k 2 > SHA256SUMS.tmp
          mv SHA256SUMS.tmp release/SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)
          ls -l release/

      # Build and sign the apk repository index for the published .apk files,
      # so a running device can `apk upgrade` its device/kernel packages over
      # the network instead of re-flashing. The index is signed with a STABLE
      # key: the private half lives only in the DC1_APK_PRIVATE_KEY secret,
      # and its public half is committed at
      #   pmaports/device/testing/device-daylight-jagar/dc1-apk.rsa.pub
      # and shipped on-device into /etc/apk/keys by the device package. A
      # device that trusts that key once keeps verifying every future release.
      #
      # One-time keygen (run on any machine with openssl, then set the secret
      # and keep the .rsa file safe — it is never committed):
      #   openssl genrsa -out dc1-apk.rsa 4096
      #   openssl rsa -in dc1-apk.rsa -pubout -out dc1-apk.rsa.pub
      #   gh secret set DC1_APK_PRIVATE_KEY < dc1-apk.rsa
      # The committed dc1-apk.rsa.pub must be the mate of the secret, or the
      # build fails here (the mate check is below).
      - name: Build and sign APKINDEX
        env:
          DC1_APK_PRIVATE_KEY: ${{ secrets.DC1_APK_PRIVATE_KEY }}
        run: |
          if [ -z "$DC1_APK_PRIVATE_KEY" ]; then
            echo "::error::DC1_APK_PRIVATE_KEY secret is missing — refusing to publish an unsigned APKINDEX" >&2
            exit 1
          fi
          sh scripts/build-apkindex.sh release
          # Rebuild the manifest so it also covers APKINDEX.tar.gz. SHA256SUMS
          # already exists from the assemble step, so drop it first to keep
          # the glob from hashing the manifest itself.
          rm -f release/SHA256SUMS
          (cd release && sha256sum -- *) | LC_ALL=C sort -k 2 > SHA256SUMS.tmp
          mv SHA256SUMS.tmp release/SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)
          ls -l release/APKINDEX.tar.gz

      # PR runs: upload a workflow artifact so reviewers can download the
      # outputs. Main-branch push and workflow_dispatch runs publish a GitHub
      # release below (rolling `latest` or a tagged version), which is the
      # canonical copy of the same files; skip the redundant upload there
      # (~24 s) and avoid a second 500 MB+ upload of the same bytes.
      - name: Upload workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dc1-pmos-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - name: Write release notes
        run: |
          {
            echo "Automated build of \`${GITHUB_SHA}\`."
            echo
            echo "**hardware_verified=false** — a green build proves the"
            echo "artifacts compile, not that they boot. Read the README"
            echo "warning before flashing anything."
            echo
            echo '```'
            cat release/PROVENANCE
            echo '```'
          } > notes.md

      # Rolling prerelease: recreate `latest` so no stale asset from a
      # previous build can outlive its SHA256SUMS.
      - name: Publish rolling prerelease
        if: >-
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
          && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rolling build (${GITHUB_SHA:0:12})" \
            --notes-file notes.md \
            release/*

      - name: Publish versioned release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in
            pmos-v*) ;;
            *) echo "release_tag must match pmos-v*, got: $TAG" >&2; exit 1 ;;
          esac
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            release/*
