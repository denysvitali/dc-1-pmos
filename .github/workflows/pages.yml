# Deploy the interactive Flutter onboarding preview to GitHub Pages.
#
# The on-device shell (ui/flutter/dc1_shell) also compiles for the web: the
# Unix-socket backend is swapped for an in-browser mock behind a conditional
# import (lib/backend_client.dart), so the whole Wi-Fi -> identity -> hostname
# -> timezone -> confirm -> progress flow runs in a browser with no device and
# no backend. This workflow builds that and publishes it.
#
# The official Flutter SDK is downloaded and pinned by SHA-256 rather than
# installed from a third-party action, matching this repository's
# pinned-source convention. It ships the engine + web SDK + const_finder that
# `flutter build web` needs, so the build needs none of the Alpine-dartroot
# surgery the desktop rootfs build requires.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/flutter/dc1_shell/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter (pinned by SHA-256)
        run: |
          curl -fsSL -o flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.4-stable.tar.xz
          echo "1deb32975560b12b580a7b57a46c5043b5b855403ef4b9b783bd36f8b7b9686a  flutter.tar.xz" | sha256sum -c -
          tar -xf flutter.tar.xz -C /opt
          echo /opt/flutter/bin >> "$GITHUB_PATH"

      - name: Build the web shell
        working-directory: ui/flutter/dc1_shell
        run: |
          flutter config --no-analytics
          flutter build web --release --base-href /dc-1-pmos/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/flutter/dc1_shell/build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
