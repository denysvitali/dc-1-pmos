# Lint rules are built into the analyzer, so this file needs no package:
# flutter_lints / package:lints dependency (see the note in pubspec.yaml).
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - await_only_futures
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - curly_braces_in_flow_control_structures
    - empty_statements
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - valid_regexps
