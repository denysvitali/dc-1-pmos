<!DOCTYPE html>
<html>
<head>
  <!--
    Base HREF is injected by `flutter build web --base-href` so the app works
    from the GitHub Pages project URL (https://<user>.github.io/dc-1-pmos/)
    and from a bare `python -m http.server` alike.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DC-1 first-boot setup, interactive preview.">
  <meta name="theme-color" content="#101418">
  <!-- Without this a mobile browser lays out at a ~980px desktop viewport and
       scales the whole preview down to fit the phone, so the PanelFrame's
       "full-bleed on a phone" branch never engages and everything is tiny. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- The shell's own background, so the page is already dark while the
       Flutter bundle loads and never flashes white around the framed
       preview. -->
  <style>
    html, body { background-color: #101418; margin: 0; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DC-1 setup">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>DC-1 setup</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
